<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>社費繳費紀錄（檢視）</title>
  <style>
    :root {
      --bg: #f4f6fb; --card: #ffffff; --text: #1f2933; --muted: #7b8794;
      --border: #e4e7eb; --primary: #3b82f6; --danger: #ef4444; --success: #10b981;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
    .card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 20px; margin-bottom: 20px; }

    .stats { display: flex; gap: 12px; margin-bottom: 8px; }
    .stat { flex: 1; background: var(--card); border-radius: 12px; padding: 14px; text-align: center; box-shadow: var(--shadow); }
    .stat .num { font-size: 26px; font-weight: 700; }
    .stat.paid .num { color: var(--success); }
    .stat.unpaid .num { color: var(--danger); }
    .stat.total .num { color: var(--primary); }
    .stat .lbl { font-size: 13px; color: var(--muted); }
    .bar { height: 8px; background: #e5e7eb; border-radius: 999px; overflow: hidden; margin: 4px 0 20px; }
    .bar > div { height: 100%; background: var(--success); width: 0; transition: width .3s; }

    .search input { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid var(--border); border-radius: 10px; outline: none; }
    .search input:focus { border-color: var(--primary); }
    .search { margin-bottom: 14px; }

    .sec-title { font-size: 14px; font-weight: 700; margin: 18px 4px 6px; display: flex; align-items: center; gap: 8px; }
    .sec-title .cnt { color: var(--muted); font-weight: 500; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; justify-content: space-between; padding: 13px 4px; border-bottom: 1px solid var(--border); }
    li:last-child { border-bottom: none; }
    .name { font-weight: 600; font-size: 16px; }
    .time { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .left { display: flex; align-items: center; gap: 12px; }
    .dot { width: 34px; height: 34px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .dot.paid { background: var(--success); }
    .dot.unpaid { background: #cbd5e1; }
    .tag { font-size: 12px; padding: 4px 10px; border-radius: 999px; font-weight: 600; }
    .tag.paid { background: #d1fae5; color: #065f46; }
    .tag.unpaid { background: #fee2e2; color: #991b1b; }
    .empty { text-align: center; color: var(--muted); padding: 24px 0; }
    .foot { text-align: center; color: var(--muted); font-size: 13px; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>💰 社費繳費紀錄</h1>
    <p class="sub">👀 檢視模式（此頁只能看，不能修改）</p>

    <div class="stats">
      <div class="stat paid"><div class="num" id="s-paid">0</div><div class="lbl">已繳費</div></div>
      <div class="stat unpaid"><div class="num" id="s-unpaid">0</div><div class="lbl">還沒繳</div></div>
      <div class="stat total"><div class="num" id="s-total">0</div><div class="lbl">總人數</div></div>
    </div>
    <div class="bar"><div id="bar"></div></div>

    <div class="card">
      <div class="search"><input type="text" id="searchInput" placeholder="🔍 搜尋名字…" autocomplete="off" /></div>

      <div class="sec-title" style="color:var(--danger)">🔴 還沒繳 <span class="cnt" id="c-unpaid"></span></div>
      <ul id="list-unpaid"></ul>
      <div class="empty" id="empty-unpaid" style="display:none">大家都繳了 🎉</div>

      <div class="sec-title" style="color:var(--success)">🟢 已繳費 <span class="cnt" id="c-paid"></span></div>
      <ul id="list-paid"></ul>
      <div class="empty" id="empty-paid" style="display:none">還沒有人繳費</div>
    </div>

    <div class="foot" id="foot">載入中…</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD_zGVvkYuSF1HSwo5mLslgQ_PBiz4pkso",
      authDomain: "money-739a2.firebaseapp.com",
      projectId: "money-739a2",
      storageBucket: "money-739a2.firebasestorage.app",
      messagingSenderId: "81035140984",
      appId: "1:81035140984:web:b37b23e65e43175633f28d",
      measurementId: "G-D3F73DPGZ6"
    };

    const $ = (id) => document.getElementById(id);
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const col = collection(db, "fees");
    let members = [];

    function fmtTime(ts) {
      if (!ts) return "";
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleString("zh-TW", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    }
    const byName = (a, b) => a.name.localeCompare(b.name, "zh-Hant");

    function render() {
      const kw = $("searchInput").value.trim().toLowerCase();
      const match = (m) => m.name.toLowerCase().includes(kw);
      const paid = members.filter(m => m.paid);
      const unpaid = members.filter(m => !m.paid);

      $("s-paid").textContent = paid.length;
      $("s-unpaid").textContent = unpaid.length;
      $("s-total").textContent = members.length;
      $("bar").style.width = members.length ? (paid.length / members.length * 100) + "%" : "0%";
      $("c-paid").textContent = paid.length ? `（${paid.length}）` : "";
      $("c-unpaid").textContent = unpaid.length ? `（${unpaid.length}）` : "";

      const su = unpaid.filter(match).sort(byName);
      const sp = paid.filter(match).sort((a, b) => (b.paidAt?.seconds || 0) - (a.paidAt?.seconds || 0));
      $("empty-unpaid").style.display = su.length ? "none" : "block";
      $("empty-paid").style.display = sp.length ? "none" : "block";

      $("list-unpaid").innerHTML = "";
      for (const m of su) {
        const li = document.createElement("li");
        li.innerHTML = `<div class="left"><div class="dot unpaid">—</div><div class="name"></div></div><span class="tag unpaid">未繳</span>`;
        li.querySelector(".name").textContent = m.name;
        $("list-unpaid").appendChild(li);
      }
      $("list-paid").innerHTML = "";
      for (const m of sp) {
        const li = document.createElement("li");
        li.innerHTML = `<div class="left"><div class="dot paid">✓</div><div><div class="name"></div><div class="time">${fmtTime(m.paidAt)}</div></div></div><span class="tag paid">已繳</span>`;
        li.querySelector(".name").textContent = m.name;
        $("list-paid").appendChild(li);
      }
    }

    onSnapshot(col, (snap) => {
      members = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      $("foot").textContent = members.length ? `共 ${members.length} 位社員` : "目前還沒有社員名單";
      render();
    }, (err) => { console.error(err); $("foot").textContent = "⚠️ 連不到資料庫"; });

    $("searchInput").addEventListener("input", render);
  </script>
</body>
</html>
