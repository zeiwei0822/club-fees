<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>社費繳費紀錄</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #7b8794;
      --border: #e4e7eb;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }

    .card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 20px;
    }

    .row { display: flex; gap: 10px; }
    input[type=text] {
      flex: 1;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color .15s;
    }
    input[type=text]:focus { border-color: var(--primary); }
    button {
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    .btn-primary { background: var(--primary); color: #fff; white-space: nowrap; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    .stats { display: flex; gap: 12px; margin-bottom: 16px; }
    .stat {
      flex: 1;
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .stat .num { font-size: 26px; font-weight: 700; color: var(--primary); }
    .stat .lbl { font-size: 13px; color: var(--muted); }

    .search { margin-bottom: 14px; }
    .search input { width: 100%; }

    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 4px;
      border-bottom: 1px solid var(--border);
    }
    li:last-child { border-bottom: none; }
    .name { font-weight: 600; font-size: 16px; }
    .time { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .left { display: flex; align-items: center; gap: 12px; }
    .dot {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--success); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .del {
      background: transparent; color: var(--danger);
      font-size: 13px; padding: 6px 10px;
    }
    .del:hover { background: #fef2f2; }

    .empty { text-align: center; color: var(--muted); padding: 30px 0; }
    .banner {
      background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412;
      padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 20px;
    }
    .banner code { background: #ffedd5; padding: 1px 5px; border-radius: 4px; }
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      background: #1f2933; color: #fff; padding: 10px 18px; border-radius: 999px;
      font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>💰 社費繳費紀錄</h1>
    <p class="sub">打名字就能記錄誰交過社費了</p>

    <div id="config-warning" class="banner" style="display:none;">
      ⚠️ 還沒設定資料庫。請打開 <code>index.html</code>,把最下面的 <code>firebaseConfig</code> 換成你自己的設定。詳細步驟看 <code>README.md</code>。
    </div>

    <div class="stats">
      <div class="stat"><div class="num" id="stat-total">0</div><div class="lbl">已繳費人數</div></div>
      <div class="stat"><div class="num" id="stat-today">0</div><div class="lbl">今天新增</div></div>
    </div>

    <div class="card">
      <div class="row">
        <input type="text" id="nameInput" placeholder="輸入名字,例如：王小明" autocomplete="off" />
        <button class="btn-primary" id="addBtn">✔ 記錄已繳費</button>
      </div>
    </div>

    <div class="card">
      <div class="search"><input type="text" id="searchInput" placeholder="🔍 搜尋名字…" autocomplete="off" /></div>
      <ul id="list"></ul>
      <div class="empty" id="empty">目前還沒有人繳費紀錄</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, addDoc, deleteDoc, doc,
      onSnapshot, query, orderBy, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ======================================================================
    //  👇👇👇  把這一段換成你自己的 Firebase 設定（步驟看 README.md） 👇👇👇
    // ======================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyD_zGVvkYuSF1HSwo5mLslgQ_PBiz4pkso",
      authDomain: "money-739a2.firebaseapp.com",
      projectId: "money-739a2",
      storageBucket: "money-739a2.firebasestorage.app",
      messagingSenderId: "81035140984",
      appId: "1:81035140984:web:b37b23e65e43175633f28d",
      measurementId: "G-D3F73DPGZ6"
    };
    // ======================================================================

    const $ = (id) => document.getElementById(id);
    const listEl = $("list"), emptyEl = $("empty"), toastEl = $("toast");
    let members = [];

    // 還沒設定就顯示提醒
    if (firebaseConfig.apiKey === "PASTE_YOUR_API_KEY") {
      $("config-warning").style.display = "block";
    }

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const col = collection(db, "fees");

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 1800);
    }

    function fmtTime(ts) {
      if (!ts) return "";
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleString("zh-TW", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    function isToday(ts) {
      if (!ts) return false;
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      const n = new Date();
      return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
    }

    function render() {
      const kw = $("searchInput").value.trim().toLowerCase();
      const shown = members.filter(m => m.name.toLowerCase().includes(kw));

      $("stat-total").textContent = members.length;
      $("stat-today").textContent = members.filter(m => isToday(m.paidAt)).length;

      listEl.innerHTML = "";
      emptyEl.style.display = shown.length ? "none" : "block";
      if (!shown.length && members.length && kw) emptyEl.textContent = "找不到符合的名字";
      else emptyEl.textContent = "目前還沒有人繳費紀錄";

      for (const m of shown) {
        const li = document.createElement("li");
        li.innerHTML = `
          <div class="left">
            <div class="dot">✓</div>
            <div><div class="name"></div><div class="time">${fmtTime(m.paidAt)}</div></div>
          </div>
          <button class="del">刪除</button>`;
        li.querySelector(".name").textContent = m.name;
        li.querySelector(".del").onclick = () => removeMember(m);
        listEl.appendChild(li);
      }
    }

    async function addMember() {
      const name = $("nameInput").value.trim();
      if (!name) { toast("請先輸入名字"); return; }
      if (members.some(m => m.name === name)) {
        if (!confirm(`「${name}」已經記錄過了，還要再新增一筆嗎？`)) return;
      }
      $("addBtn").disabled = true;
      try {
        await addDoc(col, { name, paidAt: serverTimestamp() });
        $("nameInput").value = "";
        toast(`已記錄：${name}`);
      } catch (e) {
        toast("儲存失敗，請檢查資料庫設定");
        console.error(e);
      } finally {
        $("addBtn").disabled = false;
        $("nameInput").focus();
      }
    }

    async function removeMember(m) {
      if (!confirm(`確定刪除「${m.name}」的繳費紀錄嗎？`)) return;
      try {
        await deleteDoc(doc(db, "fees", m.id));
        toast("已刪除");
      } catch (e) {
        toast("刪除失敗");
        console.error(e);
      }
    }

    // 即時同步：任何人更新資料庫，畫面自動更新
    onSnapshot(query(col, orderBy("paidAt", "desc")), (snap) => {
      members = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, (err) => {
      console.error(err);
      toast("連不到資料庫，請檢查設定與權限");
    });

    $("addBtn").onclick = addMember;
    $("nameInput").addEventListener("keydown", (e) => { if (e.key === "Enter") addMember(); });
    $("searchInput").addEventListener("input", render);
  </script>
</body>
</html>
